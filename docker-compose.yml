services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: historian_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  simulator:
    build: ./simulator
    container_name: historian_simulator
    restart: unless-stopped
    environment:
      # Overrides localhost so the container reaches timescaledb across Docker's bridge network
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB}
      SIM_SEED: ${SIM_SEED}
    depends_on:
      timescaledb:
        condition: service_healthy

volumes:
  pgdata: