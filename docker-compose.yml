services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: historian_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # ports:
    #   - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} && psql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c \"SELECT 1 FROM pg_roles WHERE rolname = 'grafana_reader';\"" ]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  simulator:
    build: ./simulator
    container_name: historian_simulator
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB}
      AUTO_SEED_DAYS: ${AUTO_SEED_DAYS}
      SIMULATION_SPEED: ${SIMULATION_SPEED:-1}
    volumes:
      - ./simulator/src:/app/src
    depends_on:
      timescaledb:
        condition: service_healthy

  adminer:
    image: adminer:latest
    container_name: historian_adminer
    restart: unless-stopped
    # ports:
    #   - "3000:8080"
    environment:
      ADMINER_DEFAULT_SERVER: timescaledb
    depends_on:
      timescaledb:
        condition: service_healthy

  api:
    build: ./api
    container_name: historian_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB}
      PORT: 4000
      INTERNAL_UI_SECRET: ${INTERNAL_UI_SECRET}
    # ports:
    #   - "${PORT:-4000}:4000"
    volumes:
      - ./api/src:/app/src
    depends_on:
      timescaledb:
        condition: service_healthy

  integration-service:
    build: ./integration-service
    container_name: historian_integration
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB}
      PORT: 4001
      INTEGRATION_PORT: 4001
      API_KEY_EXTERNAL: ${API_KEY_EXTERNAL}
      API_KEY_TEST: ${API_KEY_TEST}
      BATCHLINE_BASE_URL: ${BATCHLINE_BASE_URL}
      BATCHLINE_API_KEY: ${BATCHLINE_API_KEY}
      BATCHLINE_NOTIFICATION_URL: ${BATCHLINE_NOTIFICATION_URL}
      MAKE_HIGH_EXCEPTION_WEBHOOK_URL: ${MAKE_HIGH_EXCEPTION_WEBHOOK_URL}
      x_make_apikey: ${x_make_apikey}
    # ports:
    #   - "${INTEGRATION_PORT:-4001}:4001"
    volumes:
      - ./integration-service/src:/app/src
    depends_on:
      timescaledb:
        condition: service_healthy
  frontend:
    build: ./frontend
    container_name: historian_frontend
    restart: unless-stopped
    # ports:
    #   - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - api
      # - integration-service
      - adminer

  # Tunnel 1: Dedicated to Operator UI & Telemetry Stream
  ngrok-ui:
    image: ngrok/ngrok:latest
    container_name: historian_ngrok_ui
    restart: unless-stopped
    command:
      - "http"
      - "--url=${NGROK_DOMAIN_UI}"
      - "frontend:80"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN_UI}
    depends_on:
      - frontend

  # Tunnel 2: Dedicated strictly to BatchLine / External Webhooks
  ngrok-integration:
    image: ngrok/ngrok:latest
    container_name: historian_ngrok_integration
    restart: unless-stopped
    command:
      - "http"
      - "--url=${NGROK_DOMAIN_INTEGRATION}"
      - "integration-service:4001"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN_INTEGRATION}
    depends_on:
      - integration-service
